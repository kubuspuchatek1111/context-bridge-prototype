[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-context-bridge"
version = "0.1.0"
description = "Minimalny lokalny CLI do zapisywania checkpointów pracy w repozytoriach git"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
bridge = "ai_context_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
